# Deploy Vite build to gh-pages branch (peaceiris/actions-gh-pages).
# Install uses Bun to match bun.lockb.
#
# Repo settings required:
# - Actions → General → Workflow permissions: Read and write
# - Pages → Source: Deploy from branch → gh-pages → / (root)
#   If the live site loads /main.js (MIME errors for CSS/SVG), Pages is
#   serving main or /docs instead of gh-pages — fix in Settings, not in Vite.

name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        run: bun run build

      - name: Verify dist output (catch empty/partial builds)
        run: |
          test -f dist/index.html
          ls -la dist/assets

      - name: Upload production-ready build files
        uses: actions/upload-artifact@v4
        with:
          name: production-files
          path: ./dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: production-files
          path: ./dist

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # Single orphan commit per deploy so gh-pages always matches one full dist/
          # (avoids mixed index.html + stale assets/ from partial updates).
          force_orphan: true
