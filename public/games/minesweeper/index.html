<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Minesweeper</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #0d0d0d;
        --text: #e8eaed;
        --text-muted: rgba(232, 234, 237, 0.72);
        --accent: #ffde44;
      }

      body {
        font-family:
          'Segoe UI',
          system-ui,
          -apple-system,
          sans-serif;
        margin: 0;
        padding: 1.25rem;
        background: #000000;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      .container {
        text-align: center;
        max-width: 100%;
        box-sizing: border-box;
      }

      h1 {
        font-family: 'Press Start 2P', monospace;
        margin: 0 0 1.25rem;
        font-size: clamp(0.55rem, 2.2vw, 0.75rem);
        line-height: 2;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 400;
        color: #f6f8fa;
        border-bottom: 4px solid var(--accent);
        padding-bottom: 1em;
        -webkit-font-smoothing: none;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeSpeed;
        font-kerning: none;
        font-variant-ligatures: none;
      }

      #canvas {
        border: 4px solid var(--ink);
        box-shadow: 6px 6px 0 rgba(13, 13, 13, 0.4);
        background: #111;
        display: block;
        margin: 1rem auto;
        box-sizing: border-box;
      }

      .controls {
        margin: 1rem 0;
        padding: 1rem 0.75rem;
        text-align: left;
        max-width: 42rem;
        margin-left: auto;
        margin-right: auto;
      }

      .controls h3 {
        font-family: 'Press Start 2P', monospace;
        margin: 0 0 0.75rem;
        font-size: clamp(0.32rem, 1.25vw, 0.42rem);
        line-height: 2;
        letter-spacing: 0.04em;
        color: var(--accent);
        font-weight: 400;
        text-transform: uppercase;
        -webkit-font-smoothing: none;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeSpeed;
        font-kerning: none;
        font-variant-ligatures: none;
      }

      .controls p {
        margin: 0.5rem 0;
        font-family:
          'Segoe UI',
          system-ui,
          -apple-system,
          sans-serif;
        font-size: clamp(0.8125rem, 1.9vw, 0.9375rem);
        line-height: 1.55;
        letter-spacing: normal;
        color: var(--text-muted);
      }

      .controls strong {
        color: var(--text);
        font-weight: 600;
      }

      #status,
      #progress {
        margin: 0.75rem 0;
        font-weight: 400;
        font-family:
          'Segoe UI',
          system-ui,
          -apple-system,
          sans-serif;
        font-size: clamp(0.75rem, 1.8vw, 0.875rem);
        line-height: 1.5;
      }

      .spinner {
        height: 28px;
        width: 28px;
        margin: 0.5rem auto;
        border: 4px solid rgba(232, 234, 237, 0.2);
        border-radius: 50%;
        border-top: 4px solid var(--accent);
        animation: spin 1s linear infinite;
        display: none;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Minesweeper</h1>

      <div class="controls">
        <h3>Controls</h3>
        <p>
          <strong>Mouse:</strong> Left click to uncover, right click to flag
        </p>
        <p>
          <strong>Keyboard:</strong> 1-8 (themes), Q,W,E,R,T (sizes), A,S,D,F
          (difficulty), B (scale), N (new game), ESC (quit)
        </p>
      </div>

      <div class="spinner" id="spinner"></div>
      <div class="emscripten" id="status">Downloading...</div>
      <div class="emscripten">
        <progress value="0" max="100" id="progress" hidden="1"></progress>
      </div>

      <canvas
        class="emscripten"
        id="canvas"
        oncontextmenu="event.preventDefault()"
        tabindex="-1"
      ></canvas>
    </div>

    <script type="text/javascript">
      var statusElement = document.getElementById("status");
      var progressElement = document.getElementById("progress");
      var spinnerElement = document.getElementById("spinner");

      var Module = {
        preRun: [],
        postRun: [],
        print: (function () {
          return function (text) {
            if (arguments.length > 1)
              text = Array.prototype.slice.call(arguments).join(" ");
            console.log(text);
          };
        })(),
        printErr: function (text) {
          if (arguments.length > 1)
            text = Array.prototype.slice.call(arguments).join(" ");
          console.error(text);
        },
        canvas: (function () {
          var canvas = document.getElementById("canvas");
          canvas.addEventListener(
            "webglcontextlost",
            function (e) {
              alert("WebGL context lost. You will need to reload the page.");
              e.preventDefault();
            },
            false,
          );
          return canvas;
        })(),
        setStatus: function (text) {
          if (!Module.setStatus.last)
            Module.setStatus.last = { time: Date.now(), text: "" };
          if (text === Module.setStatus.last.text) return;
          var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
          var now = Date.now();
          if (m && now - Module.setStatus.last.time < 30) return; // if this is a progress update, skip it if too soon
          Module.setStatus.last.time = now;
          Module.setStatus.last.text = text;
          statusElement.innerHTML = text;

          if (text) {
            spinnerElement.style.display = "block";
          } else {
            spinnerElement.style.display = "none";
          }
        },
        totalDependencies: 0,
        monitorRunDependencies: function (left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(
            left
              ? "Preparing... (" +
                  (this.totalDependencies - left) +
                  "/" +
                  this.totalDependencies +
                  ")"
              : "All downloads complete.",
          );
        },
      };
      Module.setStatus("Downloading...");
      window.onerror = function () {
        Module.setStatus("Exception thrown, see JavaScript console");
        spinnerElement.style.display = "none";
        Module.setStatus = function (text) {
          if (text) console.error("[post-exception status] " + text);
        };
      };
    </script>
    <script async type="text/javascript" src="index.js"></script>
  </body>
</html>
